# Render Blueprint — stabils URL BEZ sava domēna:
#   https://neural-trading-ai.onrender.com
# Dashboard → New → Blueprint → šis repo. Adrese nemainās pēc restart.
services:
  - type: web
    name: neural-trading-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NTA_PRODUCTION
        value: "1"
      - key: NTA_SECURE_COOKIES
        value: "1"
      - key: NTA_ADMIN_USER
        value: admin
      - key: NTA_ADMIN_PASSWORD
        sync: false
      - key: NTA_SECRET_KEY
        generateValue: true
      - key: NTA_PUBLIC_URL
        value: https://neural-trading-ai.onrender.com
      - key: NEURAL_AI_DATA_DIR
        value: /data
    # Persistents disks: Render free bieži to neļauj.
    # Kad vajag saglabāt klientus pēc redeploy — upgrade uz Starter un pievieno disk /data.
