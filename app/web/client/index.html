<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NEURAL Trading AI · Klients</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/static/app.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24" fill="none">
        <path d="M3 16c3-8 5-8 8 0s5 8 8 0" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 12h2M18 12h2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-robot" viewBox="0 0 24 24" fill="none">
        <rect x="5" y="8" width="14" height="11" rx="3" stroke="currentColor" stroke-width="1.75"/>
        <path d="M12 4.5V8M9.5 16.5h5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        <circle cx="9.2" cy="13" r=".8" fill="currentColor"/>
        <circle cx="15.2" cy="13" r=".8" fill="currentColor"/>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24" fill="none">
        <rect x="7" y="6" width="3.5" height="12" rx="1" stroke="currentColor" stroke-width="1.75"/>
        <rect x="13.5" y="6" width="3.5" height="12" rx="1" stroke="currentColor" stroke-width="1.75"/>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.75"/>
        <path d="M10 8.8v6.4l5.4-3.2L10 8.8z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-logout" viewBox="0 0 24 24" fill="none">
        <path d="M10 6H7a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        <path d="M14 8l4 4-4 4M18 12H10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <div id="login" class="screen">
    <header class="hero">
      <div class="brand-icon"><svg class="ico"><use href="#i-logo"></use></svg></div>
      <h1 data-i18n="brand">NEURAL Trading AI</h1>
      <p data-i18n="tagline">Tavs robots</p>
    </header>
    <form id="loginForm" class="card" autocomplete="username">
      <h2 data-i18n="loginTitle">Klienta ieeja</h2>
      <label><span data-i18n="username">Lietotājvārds</span>
        <input name="username" required maxlength="64" autocomplete="username">
      </label>
      <label><span data-i18n="password">Parole</span>
        <input name="password" type="password" required maxlength="256" autocomplete="current-password">
      </label>
      <label><span data-i18n="language">Valoda</span>
        <select id="loginLang" name="language">
          <option value="lv">Latviešu</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
      </label>
      <button class="btn primary" type="submit" data-i18n="enter">Ienākt</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>

  <div id="shell" class="screen hidden">
    <header class="top">
      <div>
        <strong id="clientName">—</strong>
        <small id="runState">—</small>
      </div>
      <div class="top-actions">
        <select id="langSelect" aria-label="Language">
          <option value="lv">LV</option>
          <option value="en">EN</option>
          <option value="ru">RU</option>
        </select>
        <button type="button" id="logoutBtn" class="btn ghost" data-i18n="logout">
          <svg class="ico"><use href="#i-logout"></use></svg> Iziet
        </button>
      </div>
    </header>

    <section id="guide" class="panel hidden">
      <h2 data-i18n="guideTitle">Kas jādara tagad</h2>
      <p class="lead" data-i18n="guideLead"></p>
      <ol class="steps">
        <li data-i18n="step1"></li>
        <li data-i18n="step2"></li>
        <li data-i18n="step3"></li>
        <li data-i18n="step4"></li>
      </ol>
      <div id="guideStatus" class="status-pill">…</div>
    </section>

    <section id="robot" class="panel hidden">
      <div class="robot-head">
        <h2><svg class="ico accent"><use href="#i-robot"></use></svg> <span data-i18n="robotTitle">Robots strādā</span></h2>
        <span id="livePill" class="status-pill">—</span>
      </div>
      <div class="scores">
        <div class="score"><span>BUY</span><strong id="scoreBuy">0%</strong><i id="barBuy"></i></div>
        <div class="score"><span>HOLD</span><strong id="scoreHold">0%</strong><i id="barHold"></i></div>
        <div class="score"><span>SELL</span><strong id="scoreSell">0%</strong><i id="barSell"></i></div>
      </div>
      <div class="evo">
        <span data-i18n="evolution">Evolūcijas koeficients</span>
        <strong id="evoCoef">0</strong>
        <small><span data-i18n="generation">Paaudze</span> <b id="evoGen">0</b> · <span data-i18n="samples">Mācību paraugi</span> <b id="evoSamples">0</b></small>
      </div>
      <div class="meta">
        <div><span data-i18n="market">Tirgus</span><b id="marketEpic">—</b></div>
        <div><span data-i18n="size">Lots</span><b id="marketSize">—</b></div>
        <div><span data-i18n="position">Pozīcija</span><b id="positionLine">—</b></div>
      </div>
      <div class="meta">
        <div><span data-i18n="entryBlock">Ieejas statuss</span><b id="entryBlock">—</b></div>
      </div>
      <div class="controls">
        <button type="button" id="pauseBtn" class="btn dim">
          <svg class="ico"><use href="#i-pause"></use></svg> <span data-i18n="pause">Pauzēt</span>
        </button>
        <button type="button" id="resumeBtn" class="btn primary">
          <svg class="ico"><use href="#i-play"></use></svg> <span data-i18n="resume">Atsākt</span>
        </button>
      </div>
      <p id="robotError" class="error"></p>
    </section>
  </div>

  <script src="/app/static/i18n.js"></script>
  <script src="/app/static/app.js"></script>
</body>
</html>
