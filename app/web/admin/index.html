<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEURAL · Ops Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/static/admin.css?v=91">
</head>
<body>
  <div id="login" class="gate">
    <form id="loginForm" class="gate-panel">
      <p class="brand-mark">NEURAL</p>
      <h1>Ops Board</h1>
      <p class="lede">Visa flote vienā ekrānā · lot · TP · trail · P&amp;L · W/L</p>
      <label>Lietotājvārds<input name="username" required autocomplete="username"></label>
      <label>Parole<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Ienākt</button>
      <p id="loginError" class="error"></p>
      <p class="links"><a href="/">/</a> · <a href="/app">/app</a></p>
    </form>
  </div>

  <div id="dash" class="board hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark">NEURAL</span>
        <span class="topbar-sub">Ops Board · viena lapa</span>
      </div>
      <div class="topbar-actions">
        <span id="clock" class="clock"></span>
        <button type="button" id="refreshBtn" class="btn">Atsvaidzināt</button>
        <button type="button" id="resetLearningBtn" class="btn ghost">Mācīties no jauna</button>
        <a class="btn ghost" href="/app" target="_blank" rel="noopener">/app</a>
        <button type="button" id="logoutBtn" class="btn ghost">Iziet</button>
      </div>
    </header>

    <section id="summary" class="fleet"></section>
    <section id="controlRoom" class="cards"></section>

    <details class="ops">
      <summary>Reģistrācija · jauns klients / brokeris</summary>
      <div class="ops-grid">
        <article>
          <h3>Jauns klients</h3>
          <form id="createForm">
            <label>Login<input name="username" required maxlength="64"></label>
            <label>Parole<input name="password" required minlength="4" maxlength="256"></label>
            <label>Vārds<input name="display_name" maxlength="120"></label>
            <label>Valoda
              <select name="language">
                <option value="lv">Latviešu</option>
                <option value="en">English</option>
                <option value="ru">Русский</option>
              </select>
            </label>
            <button class="btn" type="submit">Izveidot</button>
            <p id="createMsg" class="muted"></p>
          </form>
        </article>
        <article>
          <h3>Brokeris</h3>
          <form id="brokerForm">
            <label>Klients<select name="client_id" id="brokerClient" required></select></label>
            <label>Tips<select name="broker_type" id="brokerType" required></select></label>
            <label>Nosaukums<input name="display_name" maxlength="120"></label>
            <label>API key<input name="api_key" required maxlength="256" autocomplete="off"></label>
            <label>Identifier<input name="identifier" required maxlength="256" autocomplete="off"></label>
            <label>API parole<input name="password" type="password" required maxlength="256" autocomplete="off"></label>
            <button class="btn" type="submit">Saglabāt + palaist</button>
            <p id="brokerMsg" class="muted"></p>
          </form>
        </article>
      </div>
    </details>
  </div>
  <script src="/admin/static/admin.js?v=91"></script>
</body>
</html>
