# Render — stabils URL. DATI: obligāti Disk uz /data, citādi redeploy dzēš klientus+history.
# Free bieži neļauj disk — tad upgrade uz Starter un pievieno disk zemāk.
services:
  - type: web
    name: neural-trading-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: nta-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NTA_PRODUCTION
        value: "1"
      - key: NTA_SECURE_COOKIES
        value: "1"
      - key: NTA_ADMIN_USER
        value: admin
      - key: NTA_ADMIN_PASSWORD
        sync: false
      - key: NTA_SECRET_KEY
        sync: false
      - key: NTA_PUBLIC_URL
        value: https://neural-trading-ai.onrender.com
      - key: NEURAL_AI_DATA_DIR
        value: /data
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
