services:
  neural-trading:
    build: .
    ports:
      - "8765:8765"
    environment:
      NTA_PRODUCTION: "1"
      NTA_SECURE_COOKIES: "1"
      NTA_ADMIN_USER: admin
      # Must set a strong secret (≥12 chars); weak defaults are refused at boot.
      NTA_ADMIN_PASSWORD: ${NTA_ADMIN_PASSWORD:?set NTA_ADMIN_PASSWORD}
      NTA_PUBLIC_URL: ${NTA_PUBLIC_URL:-http://127.0.0.1:8765}
      NEURAL_AI_DATA_DIR: /data
    volumes:
      - nta-data:/data
    restart: unless-stopped

volumes:
  nta-data:
