<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OHLC · klientam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/admin/static/vs-logo-mark.png" type="image/png">
  <link rel="stylesheet" href="/admin/static/admin.css?v=137">
  <link rel="stylesheet" href="/admin/static/ohlc-page.css?v=3">
</head>
<body class="ohlc-page">
  <header class="ohlc-page-head">
    <div>
      <p class="eyebrow">VS-System · Desk</p>
      <h1 id="title">OHLC</h1>
      <p id="subtitle" class="muted">Ielādē…</p>
    </div>
    <div class="ohlc-page-actions">
      <span class="ohlc-live stale" id="liveBadge" title="Live atjaunošana">
        <span class="dot" aria-hidden="true"></span>
        <span id="liveText">…</span>
      </span>
      <div class="ohlc-range" role="group" aria-label="Sveču logs">
        <button type="button" data-n="40">40</button>
        <button type="button" data-n="60" class="active">60</button>
        <button type="button" data-n="90">90</button>
        <button type="button" data-n="120">120</button>
      </div>
      <button type="button" class="btn tiny btn-ghost" id="btnFullscreen">Pilnekrāns</button>
      <button type="button" class="btn tiny btn-ghost" id="btnRefresh">Atjaunot</button>
      <button type="button" class="btn tiny btn-ghost" id="btnClose">Aizvērt</button>
    </div>
  </header>
  <main class="ohlc-page-main">
    <div class="ohlc-chart-wrap" id="chartWrap">
      <canvas id="chart" class="ohlc-full" width="1100" height="560"></canvas>
    </div>
    <div id="chips" class="ohlc-chips" aria-label="Leģenda"></div>
    <p id="error" class="error" hidden></p>
  </main>
  <script src="/admin/static/ohlc-chart.js?v=13"></script>
  <script src="/admin/static/ohlc-page.js?v=8"></script>
</body>
</html>
